name: conformance

# What this job asserts, and what it does not.
#
# It asserts that this checkout still computes what the committed baseline says it
# computes for the ISO/IEC 39075 path patterns -- every construct, in both directions.
# A cell that gets worse is a semantics regression. A cell that gets better also fails,
# because a baseline that no longer describes the engine cannot catch the next
# regression: the stale line hides it.
#
# It does not assert conformance. Ten cells in the baseline are DIVERGES today, and
# they are the open dialect questions in #1646, not regressions. Turning them green is
# work; keeping them from moving silently is this job.
#
# #1140 was found by an external suite rather than by our tests, and #1142 existed to
# fix that and was closed without anything in the repository running the suite. This is
# that, actually wired up.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/query/**'
      - 'src/http/**'
      - 'tools/conformance/**'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:

jobs:
  gpml:
    name: GPML path-pattern conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` below needs the tags, and needs enough history to reach
          # them. checkout fetches neither by default: `fetch-tags` is false, and a
          # depth-1 clone cannot walk back to a tag that is not on HEAD.
          fetch-depth: 0
          fetch-tags: true

      # Which build this run is measuring.
      #
      # The suite defaults this to a hardcoded `v1.10.0`
      # (`SamyamaAdapter(build=os.environ.get("SAMYAMA_BUILD", "v1.10.0"))`) and
      # nothing here ever set it, so every run has been labelling the measurement
      # with a release it was not measuring. The engine has been v1.11.0 since
      # 2026-10-02 and gate A has been printing
      # `samyama v1.10.0 (binary reports 1.11.0)` on every run since.
      #
      # That parenthetical is `SamyamaAdapter._version` working as designed: the
      # build label is treated as authoritative, the engine's own `engine_version`
      # is the cross-check, and a disagreement is printed rather than swallowed.
      # It is meant to catch "the wrong binary was measured". Firing on every
      # single run is how such a warning stops being read.
      #
      # The nearest TAG is the right source, and the two obvious alternatives are
      # both wrong:
      #
      #   `git describe --tags --always` yields `v1.11.0-25-gc24f8ad` on any commit
      #   after the tag. `_version` compares the label to the binary's report as
      #   strings, so that never matches and the warning fires forever -- the very
      #   thing being fixed.
      #
      #   Cargo.toml's version makes the cross-check vacuous. The binary reports
      #   `crate::VERSION`, which is `env!("CARGO_PKG_VERSION")`, so both sides
      #   would come from the same file and agree by construction.
      #
      # `--abbrev=0` gives the nearest tag and nothing else. It equals the binary's
      # report on a released commit, and differs exactly when Cargo.toml has been
      # bumped without a tag -- which is the case worth being told about.
      #
      # `unspecified` rather than a guess when there is no tag to find: the suite
      # prints it as the label, and the binary's own version still appears in the
      # parenthetical, so nothing is claimed that was not measured.
      - name: Which build is being measured
        run: |
          set -euo pipefail
          label=$(git describe --tags --abbrev=0 2>/dev/null || echo unspecified)
          echo "SAMYAMA_BUILD=$label" >> "$GITHUB_ENV"
          echo "build label for this run: $label"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Build the engine
        run: cargo build --release --bin samyama

      - name: Run the suite against the baseline
        run: ./tools/conformance/run.sh

      - name: Keep the map, whatever the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-map
          path: |
            target/conformance/suite/results/map.json
            target/conformance/suite/results/summary.json
          if-no-files-found: warn
